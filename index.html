<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A simple interest calculator built with HTML, CSS and JavaScript.">
  <title>Simple Interest Calculator</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      padding: 24px; font-family: system-ui, -apple-system, Segoe UI, sans-serif;
      color: #172033; background: linear-gradient(135deg, #eef2ff, #f8fafc);
    }
    .calculator {
      width: min(100%, 440px); background: white; padding: 32px;
      border-radius: 20px; box-shadow: 0 18px 50px rgba(30, 41, 59, .12);
    }
    h1 { margin: 0 0 8px; font-size: 1.8rem; }
    .intro { margin: 0 0 26px; color: #64748b; line-height: 1.5; }
    label { display: block; margin: 16px 0 7px; font-weight: 650; }
    input {
      width: 100%; padding: 12px 14px; border: 1px solid #cbd5e1;
      border-radius: 10px; font: inherit; outline: none;
    }
    input:focus { border-color: #4f46e5; box-shadow: 0 0 0 3px #4f46e51c; }
    button {
      width: 100%; margin-top: 24px; padding: 13px; border: 0;
      border-radius: 10px; background: #4f46e5; color: white;
      font: inherit; font-weight: 700; cursor: pointer;
    }
    button:hover { background: #4338ca; }
    .result {
      display: none; margin-top: 22px; padding: 18px; border-radius: 12px;
      background: #eef2ff; line-height: 1.8;
    }
    .result strong { color: #3730a3; }
    .error { display: none; margin-top: 12px; color: #b91c1c; }
    .formula { margin-top: 22px; color: #64748b; font-size: .9rem; }
  </style>
</head>
<body>
  <main class="calculator">
    <h1>Simple Interest Calculator</h1>
    <p class="intro">Calculate the interest earned or paid over time.</p>
    <form id="interest-form">
      <label for="principal">Principal amount (₹)</label>
      <input id="principal" type="number" min="0.01" step="any" placeholder="e.g. 10000" required>
      <label for="rate">Annual interest rate (%)</label>
      <input id="rate" type="number" min="0" step="any" placeholder="e.g. 5" required>
      <label for="time">Time (years)</label>
      <input id="time" type="number" min="0.01" step="any" placeholder="e.g. 2" required>
      <button type="submit">Calculate Interest</button>
    </form>
    <p class="error" id="error" role="alert"></p>
    <section class="result" id="result" aria-live="polite">
      <div>Simple Interest: <strong id="interest"></strong></div>
      <div>Total Amount: <strong id="total"></strong></div>
    </section>
    <p class="formula">Formula: Simple Interest = (Principal × Rate × Time) ÷ 100</p>
  </main>
  <script>
    const form = document.getElementById("interest-form");
    const error = document.getElementById("error");
    const result = document.getElementById("result");
    const formatINR = value => new Intl.NumberFormat("en-IN", {
      style: "currency", currency: "INR", maximumFractionDigits: 2
    }).format(value);
    form.addEventListener("submit", event => {
      event.preventDefault();
      const principal = Number(document.getElementById("principal").value);
      const rate = Number(document.getElementById("rate").value);
      const time = Number(document.getElementById("time").value);
      if (![principal, rate, time].every(Number.isFinite) ||
          principal <= 0 || rate < 0 || time <= 0) {
        error.textContent = "Enter a principal greater than 0, a rate of 0 or more, and a time greater than 0.";
        error.style.display = "block";
        result.style.display = "none";
        return;
      }
      const interest = principal * rate * time / 100;
      error.style.display = "none";
      document.getElementById("interest").textContent = formatINR(interest);
      document.getElementById("total").textContent = formatINR(principal + interest);
      result.style.display = "block";
    });
  </script>
</body>
</html>
